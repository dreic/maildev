# MailDev configuration
#
# Read by maildev.service as an EnvironmentFile. Every setting below has a
# command-line equivalent; run `maildev --help` for the full list, or see
# https://github.com/maildev/maildev/blob/main/packages/cli/README.md
#
# Restart after editing:  systemctl restart maildev
#
# This file configures the single instance run by maildev.service. To run several
# instances side by side, leave that service disabled and use the maildev@.service
# template instead, with one config file per instance in
# /etc/maildev/instances/ — see /usr/share/doc/maildev/instance.conf.example

# Port the SMTP server listens on for captured mail. Point your application's
# mail transport here.
MAILDEV_SMTP_PORT=1025

# Address the SMTP server binds to. Defaults to all interfaces; set to
# 127.0.0.1 to accept mail only from this host.
MAILDEV_IP=::

# Port and bind address for the web interface and REST API.
MAILDEV_WEB_PORT=1080
MAILDEV_WEB_IP=0.0.0.0

# Where captured mail is persisted. Must stay writable by the maildev user.
MAILDEV_MAIL_DIRECTORY=/var/lib/maildev

# Maximum emails to keep. Older mail is discarded along with its files once the
# limit is reached, which keeps both memory use and the mail directory bounded.
# Set to 0 to keep everything — memory and disk then grow without limit.
MAILDEV_MAX_EMAILS=1000

# HTTP basic auth for the web interface. Both must be set to take effect.
#MAILDEV_WEB_USER=admin
#MAILDEV_WEB_PASS=

# Require SMTP authentication for incoming mail. Both must be set.
#MAILDEV_INCOMING_USER=
#MAILDEV_INCOMING_PASS=

# Relay captured mail on to a real SMTP server.
#MAILDEV_OUTGOING_HOST=
#MAILDEV_OUTGOING_PORT=25

# Serve the web interface under a sub-path, e.g. behind a reverse proxy.
#MAILDEV_BASE_PATHNAME=/

# Enable the MCP endpoint at /mcp for AI agent integration.
#MAILDEV_MCP=true

# Verbose logging.
#MAILDEV_VERBOSE=true
